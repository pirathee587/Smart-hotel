worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # =========================================================================
    # 1. JWT TOKEN-BASED RATE LIMITING (with IP Fallback for Anonymous Requests)
    # =========================================================================
    # Extracts Bearer JWT token from Authorization header; falls back to client IP if absent
    map $http_authorization $rate_limit_key {
        "~*^Bearer\s+(\S+)" $1;
        default $binary_remote_addr;
    }

    # Token/IP-based rate limiting zone at 100 req/sec per token/IP with burst allowance
    limit_req_zone $rate_limit_key zone=jwt_limit:10m rate=100r/s;
    limit_req_status 429;

    # Upstream definition for YARP Gateway
    upstream yarp_gateway {
        server gateway:5000;
        keepalive 32;
    }

    # =========================================================================
    # 2. HTTP SERVER (Port 80) -> Redirect to HTTPS
    # =========================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name localhost;

        # Allow health checks or ACME challenges on port 80 if needed
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =========================================================================
    # 3. HTTPS SERVER (Port 443) -> SSL Termination & Reverse Proxy
    # =========================================================================
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name localhost;

        # SSL Certificates
        ssl_certificate /etc/nginx/certs/nginx-selfsigned.crt;
        ssl_certificate_key /etc/nginx/certs/nginx-selfsigned.key;

        # SSL Configuration & Ciphers
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # =====================================================================
        # SECURITY HEADERS
        # =====================================================================
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # =====================================================================
        # REVERSE PROXY TO YARP GATEWAY
        # =====================================================================
        location / {
            # Apply JWT token rate limit (or IP rate limit for unauthenticated requests)
            limit_req zone=jwt_limit burst=50 nodelay;

            proxy_pass http://yarp_gateway;
            proxy_http_version 1.1;

            # WebSocket and persistent connection headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Client identity and proxy forwarding headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_buffering off;
        }
    }
}
