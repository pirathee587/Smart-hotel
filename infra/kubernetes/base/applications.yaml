apiVersion: apps/v1
kind: Deployment
metadata: {name: field-ops}
spec:
  replicas: 2
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app: field-ops}}
  template:
    metadata: {labels: {app: field-ops}}
    spec:
      containers:
        - name: field-ops
          image: smarthotel-field-ops:dev
          ports: [{name: http, containerPort: 8084}]
          envFrom: [{configMapRef: {name: smarthotel-config}}]
          env:
            - {name: SPRING_DATASOURCE_URL, value: jdbc:postgresql://postgres:5432/smarthotel_fieldops}
            - {name: SPRING_DATASOURCE_USERNAME, valueFrom: {secretKeyRef: {name: smarthotel-secrets, key: postgres-user}}}
            - {name: SPRING_DATASOURCE_PASSWORD, valueFrom: {secretKeyRef: {name: smarthotel-secrets, key: postgres-password}}}
            - {name: BIOMETRICS_DEVICE_API_KEY, valueFrom: {secretKeyRef: {name: smarthotel-secrets, key: biometrics-api-key}}}
            - {name: RABBITMQ_DEFAULT_USER, valueFrom: {secretKeyRef: {name: smarthotel-secrets, key: rabbitmq-user}}}
            - {name: RABBITMQ_DEFAULT_PASS, valueFrom: {secretKeyRef: {name: smarthotel-secrets, key: rabbitmq-password}}}
          readinessProbe: {httpGet: {path: /actuator/health/readiness, port: http}, initialDelaySeconds: 30, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /actuator/health/liveness, port: http}, initialDelaySeconds: 60, periodSeconds: 20}
          resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: "1", memory: 1Gi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata: {name: field-ops}
spec: {selector: {app: field-ops}, ports: [{name: http, port: 8084, targetPort: http}]}
---
