apiVersion: apps/v1
kind: Deployment
metadata: {name: identity}
spec:
  replicas: 2
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app: identity}}
  template:
    metadata: {labels: {app: identity}}
    spec:
      containers:
        - name: identity
          image: smarthotel-identity:dev
          ports: [{name: http, containerPort: 5001}]
          envFrom: [{configMapRef: {name: smarthotel-config}}]
          env:
            - {name: ConnectionStrings__DefaultConnection, valueFrom: {secretKeyRef: {name: smarthotel-secrets, key: identity-connection}}}
          readinessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 10, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 30, periodSeconds: 20}
          resources: {requests: {cpu: 100m, memory: 192Mi}, limits: {cpu: 500m, memory: 512Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata: {name: identity}
spec: {selector: {app: identity}, ports: [{name: http, port: 5001, targetPort: http}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: hotel-ops}
spec:
  replicas: 2
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app: hotel-ops}}
  template:
    metadata: {labels: {app: hotel-ops}}
    spec:
      containers:
        - name: hotel-ops
          image: smarthotel-hotel-ops:dev
          ports: [{name: http, containerPort: 5002}, {name: grpc, containerPort: 5012}]
          envFrom: [{configMapRef: {name: smarthotel-config}}]
          env:
            - {name: ConnectionStrings__DefaultConnection, valueFrom: {secretKeyRef: {name: smarthotel-secrets, key: hotelops-connection}}}
            - {name: HOTEL_OPS_SERVICE_API_KEY, valueFrom: {secretKeyRef: {name: smarthotel-secrets, key: hotelops-api-key}}}
            - {name: RabbitMQ__UserName, valueFrom: {secretKeyRef: {name: smarthotel-secrets, key: rabbitmq-user}}}
            - {name: RabbitMQ__Password, valueFrom: {secretKeyRef: {name: smarthotel-secrets, key: rabbitmq-password}}}
            - {name: Supabase__Url, valueFrom: {secretKeyRef: {name: smarthotel-secrets, key: supabase-url}}}
            - {name: Supabase__Key, valueFrom: {secretKeyRef: {name: smarthotel-secrets, key: supabase-key}}}
          readinessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 15, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 40, periodSeconds: 20}
          resources: {requests: {cpu: 150m, memory: 256Mi}, limits: {cpu: 750m, memory: 768Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata: {name: hotel-ops}
spec: {selector: {app: hotel-ops}, ports: [{name: http, port: 5002, targetPort: http}, {name: grpc, port: 5012, targetPort: grpc}]}
---
